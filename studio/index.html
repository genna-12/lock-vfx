<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Canonical: la aggiunge il build (`vite.config.ts`, `siteUrl`)
         quando `VITE_SITE_URL` è pieno, già assoluta. Scritta qui a mano non
         potrebbe stare: Vite legge ogni `href` relativo di `<link>` come un
         asset, e un percorso che punta a una cartella fa fallire il build
         con `EISDIR`. -->
    <title>LockVFX — Studio e servizi</title>
    <!-- Versione statica (crawler senza JS): StudioPage la riallinea alla
         lingua attiva. Questa e' l'unica pagina di testo del sito, ed e'
         quella che i motori leggeranno davvero: resta indicizzata. -->
    <meta
      name="description"
      content="LockVFX è il nome con cui due artisti VFX lavorano insieme: compositing, 3D e CGI, matte painting, simulazioni, finishing. Il metodo, i servizi, i contatti."
    />
    <!-- Scheda social. Statica in italiano come la descrizione qui sopra;
         `src/lib/head.ts` la riallinea alla lingua attiva. Gli indirizzi
         assoluti li scrive il build (`vite.config.ts`, `siteUrl`): con
         `VITE_SITE_URL` pieno `%VITE_SITE_URL%` diventa il dominio e si
         aggiungono `og:url` e `canonical`, perché i crawler delle anteprime
         non eseguono JavaScript; vuoto, i percorsi restano relativi. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LockVFX" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="LockVFX — Studio e servizi" />
    <meta property="og:description" content="LockVFX è il nome con cui due artisti VFX lavorano insieme: compositing, 3D e CGI, matte painting, simulazioni, finishing. Il metodo, i servizi, i contatti." />
    <meta property="og:image" content="%VITE_SITE_URL%%BASE_URL%og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Il marchio LockVFX" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%%BASE_URL%og.png" />
    <meta name="twitter:image:alt" content="Il marchio LockVFX" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020202" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/studio.tsx"></script>
  </body>
</html>
