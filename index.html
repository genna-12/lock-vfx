<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Il poster della reel è l'LCP della home, e senza questa riga il
         browser lo scopre solo dopo aver eseguito il JS: un secondo e mezzo
         di attesa per un file che è già sul server. Vale solo qui: la pagina
         Studio non ha immagini sopra la piega. -->
    <link
      rel="preload"
      href="/images/showreel-poster.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />
    <title>LockVFX — effetti visivi per cinema, serie e pubblicità</title>
    <!-- Versione statica (crawler senza JS): App.tsx la riallinea alla lingua
         attiva. I due [Nome] sono segnaposto: mancano i nomi dei ragazzi. -->
    <meta
      name="description"
      content="LockVFX — effetti visivi per cinema, serie e pubblicità: compositing, CGI, environment, cleanup e finishing. Il nome con cui [Nome] e [Nome] lavorano insieme."
    />
    <!-- Scheda social. Statica in italiano come la descrizione qui sopra;
         `src/lib/head.ts` la riallinea alla lingua attiva, e ci aggiunge
         `og:url` e l'indirizzo assoluto dell'immagine quando il dominio è
         deciso. L'indirizzo relativo qui va bene: Vite legge come asset gli
         `href` dei `<link>`, non il `content` dei `<meta>`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LockVFX" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="LockVFX — effetti visivi per cinema, serie e pubblicità" />
    <meta property="og:description" content="LockVFX — effetti visivi per cinema, serie e pubblicità: compositing, CGI, environment, cleanup e finishing. Il nome con cui [Nome] e [Nome] lavorano insieme." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Il marchio LockVFX" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="Il marchio LockVFX" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020202" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
