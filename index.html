<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/outfit-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Il poster della reel è l'LCP della home, e senza questa riga il
         browser lo scopre solo dopo aver eseguito il JS: un secondo e mezzo
         di attesa per un file che è già sul server. Vale solo qui: la pagina
         Studio non ha immagini sopra la piega. Due righe e un `media` per
         ciascuna: il telefono scarica solo quello verticale, il resto solo
         quello orizzontale. Le condizioni sono `POSTER_TELEFONO` in
         `src/lib/media.ts`: se cambiano, cambiano insieme. -->
    <link
      rel="preload"
      href="/images/showreel-poster.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 768px)"
    />
    <link
      rel="preload"
      href="/images/showreel-poster-mobile.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
      media="(max-width: 767px)"
    />
    <title>LockVFX — effetti visivi per cinema, serie e pubblicità</title>
    <!-- Versione statica (crawler senza JS): App.tsx la riallinea alla lingua
         attiva. È `meta.description` di it.json con i nomi di `PEOPLE`
         (`src/data/people.ts`) scritti per esteso: qui non c'è
         interpolazione, se un nome cambia si cambia anche qui. -->
    <meta
      name="description"
      content="Effetti visivi per cinema, serie e pubblicità: compositing, CGI, cleanup, finishing. LockVFX è il nome con cui lavorano Denis Ruscitti e Nicholas Pantieri."
    />
    <!-- Scheda social. Statica in italiano come la descrizione qui sopra;
         `src/lib/head.ts` la riallinea alla lingua attiva. Gli indirizzi
         assoluti li scrive il build (`vite.config.ts`, `siteUrl`): con
         `VITE_SITE_URL` pieno `%VITE_SITE_URL%` diventa il dominio e si
         aggiungono `og:url` e `canonical`, perché i crawler delle anteprime
         non eseguono JavaScript; vuoto, i percorsi restano relativi. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LockVFX" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:title" content="LockVFX — effetti visivi per cinema, serie e pubblicità" />
    <meta property="og:description" content="Effetti visivi per cinema, serie e pubblicità: compositing, CGI, cleanup, finishing. LockVFX è il nome con cui lavorano Denis Ruscitti e Nicholas Pantieri." />
    <meta property="og:image" content="%VITE_SITE_URL%%BASE_URL%og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Il marchio LockVFX" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%VITE_SITE_URL%%BASE_URL%og.png" />
    <meta name="twitter:image:alt" content="Il marchio LockVFX" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#020202" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
